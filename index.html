<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematica alla Radice</title>
    <style>
        /* Reset e impostazioni generali */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
            
            /* SFUMATURA VERTICALE: ForestGreen (#1E7D32) sopra -> Brown (#793802) sotto */
            background: linear-gradient(to bottom, #1E7D32 0%, #793802 100%);
            background-attachment: fixed;
        }

        /* Testata */
        header {
            text-align: center;
            max-width: 850px;
            width: 100%;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: clamp(2.3rem, 5.5vw, 4rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            line-height: 1.1;
        }

        header p {
            font-size: clamp(1.05rem, 2.2vw, 1.35rem);
            color: #f0fdf4;
            font-weight: 300;
            opacity: 0.95;
        }

        /* Contenitore principale del Bersaglio SVG */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 620px;
            margin: auto 0;
        }

        .wheel-svg {
            width: 100%;
            height: auto;
            max-width: 580px;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.35));
        }

        /* Stili e Animazioni per gli Spicchi del Bersaglio */
        .sector-group {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: 300px 300px;
        }

        .sector-path {
            fill: rgba(255, 255, 255, 0.12);
            stroke: rgba(255, 255, 255, 0.35);
            stroke-width: 3.5px;
            transition: all 0.3s ease;
        }

        .center-circle {
            fill: rgba(255, 255, 255, 0.22);
            stroke: #ffffff;
            stroke-width: 4px;
            transition: all 0.3s ease;
        }

        /* Effetto Hover sui settori */
        .sector-group:hover {
            transform: scale(1.035);
        }

        .sector-group:hover .sector-path {
            fill: rgba(255, 255, 255, 0.28);
            stroke: #ffffff;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        .sector-group:hover .center-circle {
            fill: rgba(255, 255, 255, 0.38);
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
        }

        /* Testi e Icone dentro il bersaglio */
        .sector-text {
            fill: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-anchor: middle;
            pointer-events: none;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .center-text {
            fill: #ffffff;
            font-size: 17px;
            font-weight: 800;
            text-anchor: middle;
            pointer-events: none;
            letter-spacing: 1px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .icon {
            fill: #ffffff;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        /* Piè di pagina */
        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: #e2f1e7;
            opacity: 0.85;
            line-height: 1.6;
        }

        footer a {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- TESTATA SUPERIORE -->
    <header>
        <h1>Matematica alla Radice</h1>
        <p>Un libro di testo di matematica per i licei scientifici</p>
    </header>

    <!-- BERSAGLIO INTERATTIVO (SVG) -->
    <main>
        <svg class="wheel-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
            
            <!-- DEFINIZIONE ICONE -->
            <defs>
                <!-- Icona Download -->
                <g id="icon-download">
                    <path class="icon" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" transform="translate(-12, -12) scale(1.1)"/>
                </g>
                <!-- Icona Materiali (Cartella) -->
                <g id="icon-materiali">
                    <path class="icon" d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" transform="translate(-12, -12) scale(0.95)"/>
                </g>
                <!-- Icona Commenti (Chat) -->
                <g id="icon-commenti">
                    <path class="icon" d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z" transform="translate(-12, -12) scale(0.95)"/>
                </g>
                <!-- Icona Descrizione Testo (Libro) -->
                <g id="icon-descrizione">
                    <path class="icon" d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z" transform="translate(-12, -12) scale(0.95)"/>
                </g>
                <!-- Icona Diritto d'Autore (Bilancia/Scudo) -->
                <g id="icon-diritto">
                    <path class="icon" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" transform="translate(-12, -12) scale(0.95)"/>
                </g>
                <!-- Icona Presentazione Autore (Profilo) -->
                <g id="icon-autore">
                    <path class="icon" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" transform="translate(-12, -12) scale(0.95)"/>
                </g>
                <!-- Icona Segnalazioni (Busta/Messaggio) -->
                <g id="icon-segnalazioni">
                    <path class="icon" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" transform="translate(-12, -12) scale(0.95)"/>
                </g>
            </defs>

            <!-- 1. ORE 12: MATERIALI AGGIUNTIVI -->
            <g class="sector-group" onclick="alert('Sezione Materiali Aggiuntivi')">
                <path class="sector-path" d="M 165 66.2 A 270 270 0 0 1 435 66.2 L 350 213.4 A 100 100 0 0 0 250 213.4 Z"/>
                <use href="#icon-materiali" x="300" y="115"/>
                <text x="300" y="145" class="sector-text">
                    <tspan x="300" dy="0">Materiali</tspan>
                    <tspan x="300" dy="16">aggiuntivi</tspan>
                </text>
            </g>

            <!-- 2. ORE 2: COMMENTI SUL TESTO -->
            <g class="sector-group" onclick="alert('Sezione Commenti sul testo')">
                <path class="sector-path" d="M 435 66.2 A 270 270 0 0 1 570 300 L 400 300 A 100 100 0 0 0 350 213.4 Z"/>
                <use href="#icon-commenti" x="430" y="190"/>
                <text x="430" y="220" class="sector-text">
                    <tspan x="430" dy="0">Commenti</tspan>
                    <tspan x="430" dy="16">sul testo</tspan>
                </text>
            </g>

            <!-- 3. ORE 4: DESCRIZIONE DEL TESTO -->
            <g class="sector-group" onclick="alert('Sezione Descrizione del testo')">
                <path class="sector-path" d="M 570 300 A 270 270 0 0 1 435 533.8 L 350 386.6 A 100 100 0 0 0 400 300 Z"/>
                <use href="#icon-descrizione" x="430" y="380"/>
                <text x="430" y="410" class="sector-text">
                    <tspan x="430" dy="0">Descrizione</tspan>
                    <tspan x="430" dy="16">del testo</tspan>
                </text>
            </g>

            <!-- 4. ORE 6: DIRITTO D'AUTORE -->
            <g class="sector-group" onclick="alert('Sezione Diritto d\'autore')">
                <path class="sector-path" d="M 435 533.8 A 270 270 0 0 1 165 533.8 L 250 386.6 A 100 100 0 0 0 350 386.6 Z"/>
                <use href="#icon-diritto" x="300" y="450"/>
                <text x="300" y="480" class="sector-text">
                    <tspan x="300" dy="0">Diritto</tspan>
                    <tspan x="300" dy="16">d'autore</tspan>
                </text>
            </g>

            <!-- 5. ORE 8: PRESENTAZIONE AUTORE -->
            <g class="sector-group" onclick="alert('Sezione Presentazione autore')">
                <path class="sector-path" d="M 165 533.8 A 270 270 0 0 1 30 300 L 200 300 A 100 100 0 0 0 250 386.6 Z"/>
                <use href="#icon-autore" x="170" y="380"/>
                <text x="170" y="410" class="sector-text">
                    <tspan x="170" dy="0">Presentazione</tspan>
                    <tspan x="170" dy="16">autore</tspan>
                </text>
            </g>

            <!-- 6. ORE 10: SEGNALAZIONI -->
            <g class="sector-group" onclick="alert('Sezione Segnalazioni')">
                <path class="sector-path" d="M 30 300 A 270 270 0 0 1 165 66.2 L 250 213.4 A 100 100 0 0 0 200 300 Z"/>
                <use href="#icon-segnalazioni" x="170" y="190"/>
                <text x="170" y="220" class="sector-text">
                    <tspan x="170" dy="0">Segnalazioni</tspan>
                </text>
            </g>

            <!-- 7. CENTRO: BOTTONE DOWNLOAD -->
            <g class="sector-group" onclick="alert('Sezione Download PDF')">
                <circle cx="300" cy="300" r="92" class="center-circle"/>
                <use href="#icon-download" x="300" y="272"/>
                <text x="300" y="312" class="center-text">DOWNLOAD</text>
            </g>

        </svg>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Matematica alla Radice. Contenuti distribuiti con licenza <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.it" target="_blank" rel="noopener">CC BY-NC-ND 4.0</a>.</p>
    </footer>

</body>
</html>
