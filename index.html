<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematica alla Radice</title>
    <style>
        /* Reset generale */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
            
            /* SFUMATURA VERTICALE: ForestGreen (#1E7D32) -> Brown (#793802) */
            background: linear-gradient(to bottom, #1E7D32 0%, #793802 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Testata */
        header {
            text-align: center;
            max-width: 850px;
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
        }

        header h1 {
            font-size: clamp(2.3rem, 5.5vw, 3.8rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.4rem;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
            line-height: 1.1;
        }

        header p {
            font-size: clamp(1.05rem, 2.2vw, 1.3rem);
            color: #f0fdf4;
            font-weight: 300;
            opacity: 0.95;
        }

        /* DISPOSIZIONE CIRCOLARE (DESKTOP) */
        main {
            width: 100%;
            max-width: 650px;
            margin: auto 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .leaf-orbit {
            position: relative;
            width: 580px;
            height: 580px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Stile base dei bottoni FOGLIA */
        .leaf-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            color: #ffffff;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 12px 18px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            
            /* FORMA A FOGLIA (Angoli opposti arrotondati) */
            border-radius: 0px 75% 0px 75%;
            width: 155px;
            height: 105px;
        }

        /* Effetto al passaggio del mouse */
        .leaf-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            border-color: #ffffff;
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.3);
            transform: scale(1.1) rotate(0deg) !important;
            z-index: 10;
        }

        .leaf-btn h3 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-top: 4px;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .leaf-icon {
            width: 26px;
            height: 26px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        /* POSIZIONAMENTO SPECIFICO DELLE FOGLIE SUL CERCHIO */

        /* Centro: Download */
        .pos-center {
            width: 175px;
            height: 125px;
            border-radius: 80% 0px 80% 0px;
            background: rgba(255, 255, 255, 0.22);
            border: 2px solid #ffffff;
            z-index: 5;
        }

        .pos-center h3 {
            font-size: 1.15rem;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        .pos-center .leaf-icon {
            width: 32px;
            height: 32px;
        }

        /* Ore 12: Materiali Aggiuntivi */
        .pos-12 {
            top: 15px;
            transform: rotate(-10deg);
        }

        /* Ore 2: Commenti sul testo */
        .pos-2 {
            top: 100px;
            right: 25px;
            transform: rotate(20deg);
        }

        /* Ore 4: Descrizione del testo */
        .pos-4 {
            bottom: 100px;
            right: 25px;
            transform: rotate(-15deg);
        }

        /* Ore 6: Diritto d'autore */
        .pos-6 {
            bottom: 15px;
            transform: rotate(10deg);
        }

        /* Ore 8: Presentazione autore */
        .pos-8 {
            bottom: 100px;
            left: 25px;
            transform: rotate(20deg);
        }

        /* Ore 10: Segnalazioni */
        .pos-10 {
            top: 100px;
            left: 25px;
            transform: rotate(-20deg);
        }

        /* Piè di pagina */
        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: #e2f1e7;
            opacity: 0.85;
            line-height: 1.6;
        }

        footer a {
            color: #ffffff;
            text-decoration: underline;
        }

        /* LAYOUT ADATTIVO PER SMARTPHONE (< 650px) */
        @media (max-width: 650px) {
            .leaf-orbit {
                width: 100%;
                height: auto;
                display: flex;
                flex-direction: column;
                gap: 1.2rem;
                align-items: center;
            }

            .leaf-btn {
                position: relative !important;
                top: auto !important;
                bottom: auto !important;
                left: auto !important;
                right: auto !important;
                transform: none !important;
                width: 90% !important;
                max-width: 320px;
                height: 85px !important;
                border-radius: 0px 50px 0px 50px !important;
                flex-direction: row;
                justify-content: flex-start;
                gap: 15px;
                padding: 0 25px;
            }

            .pos-center {
                order: -1; /* Download sempre al primo posto su mobile */
                height: 95px !important;
                background: rgba(255, 255, 255, 0.25);
            }

            .leaf-btn h3 {
                font-size: 1.1rem;
                text-align: left;
            }
        }
    </style>
</head>
<body>

    <!-- TESTATA SUPERIORE -->
    <header>
        <h1>Matematica alla Radice</h1>
        <p>Un libro di testo di matematica per i licei scientifici</p>
    </header>

    <!-- STRUTTURA A FOGLIE SUL CERCHIO -->
    <main>
        <div class="leaf-orbit">

            <!-- CENTRO: DOWNLOAD -->
            <div class="leaf-btn pos-center" onclick="alert('Sezione Download PDF')">
                <svg class="leaf-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <h3>DOWNLOAD</h3>
            </div>

            <!-- ORE 12: MATERIALI AGGIUNTIVI -->
            <div class="leaf-btn pos-12" onclick="alert('Sezione Materiali Aggiuntivi')">
                <svg class="leaf-icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                <h3>Materiali aggiuntivi</h3>
            </div>

            <!-- ORE 2: COMMENTI SUL TESTO -->
            <div class="leaf-btn pos-2" onclick="alert('Sezione Commenti sul testo')">
                <svg class="leaf-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
                <h3>Commenti sul testo</h3>
            </div>

            <!-- ORE 4: DESCRIZIONE DEL TESTO -->
            <div class="leaf-btn pos-4" onclick="alert('Sezione Descrizione del testo')">
                <svg class="leaf-icon" viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>
                <h3>Descrizione del testo</h3>
            </div>

            <!-- ORE 6: DIRITTO D'AUTORE -->
            <div class="leaf-btn pos-6" onclick="alert('Sezione Diritto d\'autore')">
                <svg class="leaf-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <h3>Diritto d'autore</h3>
            </div>

            <!-- ORE 8: PRESENTAZIONE AUTORE -->
            <div class="leaf-btn pos-8" onclick="alert('Sezione Presentazione autore')">
                <svg class="leaf-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <h3>Presentazione autore</h3>
            </div>

            <!-- ORE 10: SEGNALAZIONI -->
            <div class="leaf-btn pos-10" onclick="alert('Sezione Segnalazioni')">
                <svg class="leaf-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                <h3>Segnalazioni</h3>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Matematica alla Radice. Contenuti distribuiti con licenza <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.it" target="_blank" rel="noopener">CC BY-NC-ND 4.0</a>.</p>
    </footer>

</body>
</html>
