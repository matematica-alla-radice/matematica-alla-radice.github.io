<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematica alla Radice</title>
    <style>
        /* Reset di base per tutti i browser */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Stile dello sfondo e del corpo pagina */
        body {
            background-color: #1b4332; /* Verde bosco elegante e profondo */
            color: #ffffff;            /* Testo bianco */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Titolo Principale */
        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem); /* Testo grande e dinamico */
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        /* Sottotitolo / Descrizione */
        p {
            font-size: 1.25rem;
            color: #d8f3dc; /* Verde chiarissimo e riposante */
            max-width: 600px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Matematica alla Radice</h1>
    <p>Sito in costruzione. Un nuovo approccio alla comprensione e alla divulgazione della matematica.</p>

</body>
</html>
